# Proposes updates (as pull requests) for the pinned versions. Nothing updates on its own:
# tests run on each PR, and server image updates still need `git pull` + `docker compose up -d --build`.
# cooldown: only propose releases that have been out for 14 days (brand-new releases are where
# hijacked packages tend to appear; real problems are usually spotted within days).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm # dev-only tools (ESLint, Playwright)
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      dev-tools:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /server
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
